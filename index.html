  <style>
    /* NE.W-Linien für die Dispo (Viamed Euskirchen). Daten nur mit Dispo-PIN vom Backend. Design wie die Stunden-Übersicht. */
    :root { --tinte: #14231a; --text: #2c3a31; --leise: #6b7a70; --feld: #f4f7f5; --flaeche: #eef5f0; --linie: #e8efea;
            --gruen: #2e9a3e; --gruen-2: #7cc242; --gruen-hell: #e9f7e6; --blau: #0284c7; --blau-hell: #e6f5fd; --rose: #e11d48; --rose-hell: #ffeef2;
            --gelb: #b45309; --gelb-hell: #fff4dc; --orange: #ea580c; --orange-hell: #fff1e6; --lila: #7c3aed; --lila-hell: #f3edff; --schatten: 0 8px 28px rgba(20, 50, 30, 0.08); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text); background: radial-gradient(1200px 500px at 50% -200px, #d9f0d9 0%, transparent 70%), var(--flaeche); min-height: 100vh; }
    .wrap { max-width: 1480px; margin: 0 auto; padding: 1rem 1.25rem; }
    button { font: inherit; }

    /* PIN */
    .pin-seite { min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; }
    .pin-karte { width: 100%; max-width: 380px; background: #fff; border-radius: 28px; box-shadow: 0 24px 60px rgba(20,50,30,0.15); overflow: hidden; text-align: center; }
    .pin-kopf { color: #fff; padding: 1.6rem 1.4rem 2.6rem; background: linear-gradient(135deg, #0f6b4f 0%, #2e8b3a 45%, #6fb83a 100%); }
    .pin-kopf .logo { margin: 0 auto 0.8rem; }
    .pin-kopf h1 { font-size: 1.4rem; font-weight: 800; }
    .pin-kopf p { font-size: 0.88rem; opacity: 0.92; margin-top: 0.2rem; }
    .pin-form { padding: 0 1.4rem 1.5rem; margin-top: -1.6rem; }
    .pin-form input { width: 100%; height: 60px; border-radius: 16px; border: 2px solid transparent; background: #fff; box-shadow: 0 8px 22px rgba(0,0,0,0.12); text-align: center; font-size: 1.6rem; letter-spacing: 0.4em; font-weight: 800; color: var(--tinte); }
    .pin-form input:focus { outline: none; border-color: var(--gruen); }
    .pin-form input::placeholder { letter-spacing: 0.08em; font-size: 1.05rem; font-weight: 600; color: #a3b1a8; }
    .knopf { width: 100%; height: 56px; margin-top: 0.9rem; border: none; border-radius: 16px; color: #fff; font-weight: 800; font-size: 1.05rem; cursor: pointer; background: linear-gradient(135deg, var(--gruen), var(--gruen-2)); box-shadow: 0 10px 22px rgba(0,0,0,0.14); }
    .knopf:disabled { opacity: 0.65; cursor: wait; }
    .fehler { margin-top: 0.8rem; color: var(--rose); font-size: 0.88rem; font-weight: 600; min-height: 1.2em; }

    /* Kopf */
    .hero { position: relative; overflow: hidden; color: #fff; border-radius: 26px; padding: 1.2rem 1.3rem 1.3rem; background: linear-gradient(135deg, #0f6b4f 0%, #2e8b3a 45%, #6fb83a 100%); }
    .hero::before { content: ""; position: absolute; width: 300px; height: 300px; right: -90px; top: -150px; border-radius: 50%; background: rgba(255,255,255,0.1); pointer-events: none; }
    .kopf { position: relative; display: flex; align-items: center; gap: 0.9rem; flex-wrap: wrap; }
    .logo { width: 50px; height: 50px; border-radius: 15px; background: #fff; display: grid; place-items: center; flex: none; box-shadow: 0 6px 18px rgba(0,0,0,0.15); }
    .logo img { width: 36px; height: 36px; }
    .kopf h1 { font-size: 1.45rem; font-weight: 800; letter-spacing: -0.02em; }
    .kopf p { font-size: 0.85rem; opacity: 0.9; }
    .rechts-oben { margin-left: auto; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .monat { display: flex; align-items: center; gap: 0.3rem; background: rgba(255,255,255,0.18); border-radius: 999px; padding: 0.25rem; }
    .monat button { width: 34px; height: 34px; border-radius: 50%; border: none; background: rgba(255,255,255,0.22); color: #fff; font-size: 1.1rem; cursor: pointer; }
    .monat strong { min-width: 150px; text-align: center; font-size: 0.95rem; }
    .monat strong small { display: block; font-size: 0.7rem; font-weight: 700; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.05em; }
    .abmelden, .heute-knopf { border: none; background: rgba(255,255,255,0.18); color: #fff; border-radius: 999px; padding: 0.55rem 0.9rem; font-weight: 700; font-size: 0.82rem; cursor: pointer; }
    .heute-knopf { background: #fff; color: #1f6b2b; }
    .kacheln { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.6rem; margin-top: 1.1rem; }
    .kachel { background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.22); border-radius: 18px; padding: 0.75rem 0.85rem; }
    button.kachel { text-align: left; color: inherit; cursor: pointer; }
    button.kachel:hover { background: rgba(255,255,255,0.24); }
    .kachel small { display: block; font-size: 0.72rem; font-weight: 700; opacity: 0.9; text-transform: uppercase; letter-spacing: 0.04em; }
    .kachel strong { font-size: 1.45rem; font-weight: 800; }
    .kachel span { font-size: 0.8rem; opacity: 0.9; }

    .leiste { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin: 1rem 0 0.8rem; }
    .reiter { display: flex; gap: 0.3rem; background: #fff; padding: 0.3rem; border-radius: 16px; box-shadow: var(--schatten); }
    .reiter button { border: none; background: transparent; padding: 0.55rem 0.9rem; border-radius: 12px; font-weight: 700; font-size: 0.88rem; color: var(--leise); cursor: pointer; display: flex; align-items: center; gap: 0.4rem; }
    .reiter button.an { color: #fff; background: linear-gradient(135deg, var(--gruen), var(--gruen-2)); }
    .zahl { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--rose); color: #fff; font-size: 0.72rem; display: inline-grid; place-items: center; }
    .zahl.null { background: #94a3b8; }
    .suche-box { flex: 1; min-width: 200px; position: relative; }
    .suche { width: 100%; height: 46px; border-radius: 14px; border: 2px solid transparent; background: #fff; padding: 0 0.9rem 0 2.5rem; font: inherit; font-size: 0.95rem; box-shadow: var(--schatten); }
    .suche:focus { outline: none; border-color: var(--gruen); }
    .suche-box::before { content: "⌕"; position: absolute; left: 0.85rem; top: 50%; transform: translateY(-52%); font-size: 1.25rem; color: var(--leise); pointer-events: none; }

    .raster { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.3fr); gap: 1rem; align-items: start; }
    .karte { background: #fff; border-radius: 22px; box-shadow: var(--schatten); border: 1px solid #edf2ee; overflow: hidden; }
    #rechts { position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow-y: auto; display: grid; gap: 0.9rem; align-content: start; border-radius: 22px; }
    /* Hinfahrt / Rückfahrt als eigene Felder */
    .fahrt-kopf { display: flex; align-items: center; gap: 0.6rem; padding: 0.8rem 1rem; font-weight: 800; color: var(--tinte); font-size: 0.95rem; }
    .fahrt-kopf small { margin-left: auto; font-weight: 600; color: var(--leise); font-size: 0.78rem; }
    .pfeil { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-weight: 900; background: var(--leise); flex: none; }
    .feld.hin .fahrt-kopf { background: linear-gradient(135deg, #e9f7e6, #fff); } .feld.hin .pfeil { background: var(--gruen); }
    .feld.rueck .fahrt-kopf { background: linear-gradient(135deg, #e6f5fd, #fff); } .feld.rueck .pfeil { background: var(--blau); }
    .feld.extra .fahrt-kopf { background: linear-gradient(135deg, #f2fbf0, #fff); } .feld.extra .pfeil { background: var(--gruen-2); }
    .leer.klein { padding: 1rem; }
    .fg-knoepfe { display: flex; gap: 0.35rem; flex-wrap: wrap; justify-content: flex-end; align-self: center; max-width: 260px; }
    .tag-aktion { border: none; background: var(--feld); color: var(--text); border-radius: 10px; padding: 0.4rem 0.65rem; font-weight: 700; font-size: 0.76rem; cursor: pointer; white-space: nowrap; }
    .tag-aktion:hover { background: var(--gruen-hell); color: #1f6b2b; }
    .tag-aktion.rot:hover { background: var(--rose-hell); color: var(--rose); }
    .tag-aktion.sicher { background: var(--gruen); color: #fff; }
    .knopf-neu { border: none; border-radius: 12px; height: 42px; padding: 0 1rem; font-weight: 800; font-size: 0.88rem; cursor: pointer; color: #fff; background: linear-gradient(135deg, var(--gruen), var(--gruen-2)); box-shadow: 0 6px 16px rgba(46,154,62,0.25); }
    /* Formulare (schreiben ins Google Sheet) */
    .korr { margin: 0.2rem 1rem 0.9rem; padding: 0.9rem 1rem; border-radius: 16px; background: #fff; border: 2px solid #c9e8c4; box-shadow: 0 8px 22px rgba(46,154,62,0.08); }
    .korr.rot { border-color: #f8c4d0; }
    .korr-kopf { font-size: 0.88rem; color: var(--leise); margin-bottom: 0.7rem; } .korr-kopf b { color: var(--tinte); }
    .korr-zeile { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.6rem; align-items: end; margin-bottom: 0.6rem; }
    .korr-zeile label { font-size: 0.75rem; font-weight: 700; color: var(--leise); display: block; }
    .korr-zeile label .opt { font-weight: 500; }
    .korr-zeile input:not([type=checkbox]), .korr-zeile select { display: block; width: 100%; height: 44px; margin-top: 0.25rem; border-radius: 12px; border: 2px solid transparent; background: var(--feld); padding: 0 0.7rem; font: inherit; font-size: 0.95rem; color: var(--tinte); }
    .korr-zeile input:focus, .korr-zeile select:focus { outline: none; border-color: var(--gruen); background: #fff; }
    .korr-zeile .breit { grid-column: 1 / -1; } .korr-zeile .breit2 { grid-column: span 2; }
    .korr-zeile .haken { display: flex; align-items: center; gap: 0.45rem; height: 44px; font-size: 0.9rem; color: var(--tinte); }
    .korr-zeile .haken input { width: 20px; height: 20px; accent-color: var(--gruen); }
    .chips { display: flex; gap: 0.35rem; flex-wrap: wrap; align-self: end; padding-bottom: 0.35rem; }
    .chips button { border: none; background: var(--gruen-hell); color: #1f6b2b; border-radius: 999px; padding: 0.45rem 0.75rem; font-weight: 700; font-size: 0.78rem; cursor: pointer; }
    .korr-vorschau { font-size: 0.88rem; font-weight: 700; color: var(--tinte); min-height: 1.2em; }
    .korr-vorschau .warn { color: var(--gelb); } .korr-vorschau .fehl { color: var(--rose); }
    .korr-knoepfe { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.7rem; }
    .korr-knoepfe button { border: none; border-radius: 12px; height: 44px; padding: 0 1.1rem; font-weight: 800; font-size: 0.9rem; cursor: pointer; }
    .korr-knoepfe .speichern { color: #fff; background: linear-gradient(135deg, var(--gruen), var(--gruen-2)); }
    .korr-knoepfe .speichern.rot { background: linear-gradient(135deg, #e11d48, #fb7185); }
    .korr-knoepfe .speichern:disabled { opacity: 0.5; cursor: default; }
    .korr-knoepfe .neben { background: var(--feld); color: var(--text); }
    .karte h2 { font-size: 0.95rem; padding: 0.9rem 1rem 0.6rem; color: var(--tinte); display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }
    .karte h2 small { color: var(--leise); font-weight: 600; font-size: 0.78rem; }
    .karte h2.gruppe { border-top: 1px solid var(--linie); padding-top: 1rem; justify-content: flex-start; align-items: center; }
    .karte h2.gruppe small { margin-left: auto; }
    .karte h2:first-child.gruppe { border-top: none; }
    .punkt { width: 12px; height: 12px; border-radius: 4px; flex: none; }

    /* Linien links */
    .zeile { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 0.75rem; align-items: center; padding: 0.65rem 1rem; border-top: 1px solid var(--linie); cursor: pointer; }
    .zeile:hover, .zeile.an { background: var(--gruen-hell); }
    .zeile.an { box-shadow: inset 4px 0 0 var(--gruen); }
    .zeile.beendet { opacity: 0.55; }
    .lb { min-width: 70px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 0.8rem; color: #fff; background: var(--c, #64748b); padding: 0 0.3rem; letter-spacing: -0.01em; }
    .lb.xl { min-width: 86px; height: 52px; font-size: 1rem; border-radius: 15px; }
    .zeile.person { grid-template-columns: 40px minmax(0, 1fr) auto; }
    .ava { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 0.85rem; color: #fff; }
    .name { font-weight: 700; color: var(--tinte); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .name small { font-weight: 600; color: var(--leise); font-size: 0.78rem; }
    .meta { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-top: 0.25rem; }
    .pill { border-radius: 999px; padding: 0.12rem 0.5rem; font-size: 0.72rem; font-weight: 700; background: var(--feld); color: var(--leise); white-space: nowrap; }
    .pill.k { background: var(--rose-hell); color: var(--rose); } .pill.u { background: var(--blau-hell); color: var(--blau); } .pill.w { background: var(--gelb-hell); color: var(--gelb); }
    .pill.o { background: var(--orange-hell); color: var(--orange); } .pill.l { background: var(--lila-hell); color: var(--lila); } .pill.g { background: var(--gruen-hell); color: #1f6b2b; }
    .pill.rand { background: #fff; border: 1px dashed #f3a3b5; color: var(--rose); }
    .pill.lp { background: color-mix(in srgb, var(--c) 12%, #fff); color: var(--c); cursor: pointer; border: none; font: inherit; font-size: 0.72rem; font-weight: 700; }
    .std { text-align: right; font-weight: 800; font-size: 1.15rem; color: var(--tinte); white-space: nowrap; }
    .std small { display: block; font-size: 0.7rem; color: var(--leise); font-weight: 600; }

    /* Linie rechts */
    .detail-kopf { padding: 1rem; display: flex; gap: 0.9rem; align-items: center; background: linear-gradient(135deg, var(--gruen-hell), #fff); flex-wrap: wrap; }
    .detail-kopf strong { font-size: 1.15rem; color: var(--tinte); display: block; }
    .detail-kopf .unter { font-size: 0.85rem; color: var(--leise); }
    .detail-kopf .gross { margin-left: auto; text-align: right; font-size: 1.6rem; font-weight: 900; color: #1f6b2b; }
    .detail-kopf .gross small { display: block; font-size: 0.72rem; color: var(--leise); font-weight: 700; }
    .abschnitt { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; padding: 0.85rem 1rem 0.45rem; border-top: 1px solid var(--linie); font-weight: 800; font-size: 0.82rem; color: var(--tinte); text-transform: uppercase; letter-spacing: 0.05em; }
    .abschnitt small { text-transform: none; letter-spacing: 0; color: var(--leise); font-weight: 600; font-size: 0.78rem; }
    .fg { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 0.75rem; padding: 0.65rem 1rem; border-top: 1px solid var(--linie); font-size: 0.88rem; scroll-margin: 4rem; }
    .abschnitt + .fg { border-top: none; }
    .uhr b { display: block; font-size: 1.05rem; color: var(--tinte); }
    .uhr small { display: block; color: var(--leise); font-size: 0.72rem; font-weight: 600; }
    .wer .name { white-space: normal; display: flex; gap: 0.35rem; flex-wrap: wrap; align-items: center; }
    .adr { color: var(--text); font-size: 0.82rem; margin-top: 0.15rem; }
    .notiz { display: block; color: var(--leise); font-size: 0.78rem; margin-top: 0.2rem; }
    .notiz.rot { color: var(--rose); font-weight: 600; }
    .notiz.blau { color: var(--blau); font-weight: 600; }
    .fg.abw { background: #fff6f8; } .fg.abw .uhr b { color: var(--rose); text-decoration: line-through; }
    .fg.pause { background: #f5fbff; } .fg.pause .uhr b { color: var(--blau); text-decoration: line-through; }
    .fg.wechsel { background: #fff8f1; } .fg.wechsel .uhr b { text-decoration: line-through; color: var(--orange); }
    .fg.nicht { opacity: 0.55; }
    .fg.extra { background: #f2fbf0; }
    .fg.treffer { box-shadow: inset 4px 0 0 #f59e0b; background: #fffbea; }
    .fg.weg .uhr b { color: var(--leise); }
    details.weg-liste > summary { list-style: none; cursor: pointer; }
    details.weg-liste > summary::-webkit-details-marker { display: none; }
    details.weg-liste > summary::after { content: "anzeigen"; margin-left: auto; font-size: 0.75rem; text-transform: none; letter-spacing: 0; color: #1d4ed8; }
    details.weg-liste[open] > summary::after { content: "ausblenden"; }

    /* Tagesplan & Hinweise */
    .hinweis { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 0.7rem; padding: 0.75rem 1rem; border-top: 1px solid var(--linie); font-size: 0.88rem; align-items: start; }
    .hinweis[data-l] { cursor: pointer; }
    .hinweis[data-l]:hover { background: var(--gruen-hell); }
    .hinweis .i { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-weight: 900; color: #fff; font-size: 0.9rem; }
    .hinweis b { color: var(--tinte); }
    .hinweis .klein { display: block; font-size: 0.82rem; color: var(--text); margin-top: 0.15rem; }
    .hinweis .quelle { display: block; font-size: 0.74rem; color: var(--leise); margin-top: 0.2rem; }
    .hinweis.ist-erledigt { opacity: 0.6; }
    .hinweis.ist-erledigt b { text-decoration: line-through; }
    .erl { border: none; border-radius: 12px; height: 38px; padding: 0 0.85rem; font-weight: 800; font-size: 0.8rem; cursor: pointer; white-space: nowrap; color: #fff; background: linear-gradient(135deg, var(--gruen), var(--gruen-2)); }
    .erl.zurueck { background: var(--feld); color: var(--leise); }
    .leer { padding: 2rem 1rem; text-align: center; color: var(--leise); font-size: 0.9rem; }
    .laden { position: fixed; inset: 0; background: rgba(238,245,240,0.6); display: grid; place-items: center; z-index: 40; }
    .spinner { width: 46px; height: 46px; border-radius: 50%; border: 5px solid #d6e6da; border-top-color: var(--gruen); animation: dreh 0.8s linear infinite; }
    @keyframes dreh { to { transform: rotate(360deg); } }
    .toast { position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%); z-index: 70; background: var(--tinte); color: #fff; padding: 0.8rem 1.1rem; border-radius: 14px; font-weight: 700; font-size: 0.9rem; box-shadow: 0 12px 30px rgba(0,0,0,0.25); display: flex; gap: 0.8rem; align-items: center; }
    .toast.fehler { background: var(--rose); }
    .toast button { border: none; background: rgba(255,255,255,0.2); color: #fff; border-radius: 10px; padding: 0.35rem 0.7rem; font-weight: 800; cursor: pointer; }
    .stand { text-align: center; font-size: 0.75rem; color: var(--leise); margin-top: 1rem; }
    .demo { position: fixed; top: 12px; right: -34px; transform: rotate(45deg); background: #f59e0b; color: #fff; font-size: 0.7rem; font-weight: 900; padding: 0.2rem 2.4rem; z-index: 60; letter-spacing: 0.1em; }
    @media (max-width: 820px) { .raster { grid-template-columns: 1fr; } #rechts { position: static; max-height: none; } .kacheln { grid-template-columns: repeat(2, minmax(0, 1fr)); } .rechts-oben { margin-left: 0; width: 100%; justify-content: space-between; } .detail-kopf .gross { margin-left: 0; } }
    @media (max-width: 700px) { .fg { grid-template-columns: 56px minmax(0, 1fr); } .fg-knoepfe { grid-column: 2; justify-content: flex-start; max-width: none; } .korr { margin: 0.2rem 0.6rem 0.8rem; } .korr-zeile .breit2 { grid-column: 1 / -1; } }
    @media (max-width: 520px) { .wrap { padding: 0.75rem 0.75rem; } .hinweis { grid-template-columns: 32px minmax(0, 1fr); } .hinweis .erl { grid-column: 2; justify-self: start; } .zeile { grid-template-columns: 62px minmax(0, 1fr) auto; } .lb { min-width: 62px; } }
  </style>

  <script>
    // NE.W-Linien: wertet Fahrgastliste + Tagesplan für einen Tag aus (Browser und Node-Tests, kein DOM).
// Daten kommen aus der Tabelle "NEW_Linien_Fahrgaeste", die der n8n-Workflow aus den NE.W-Mails pflegt.
const Linien = (function () {
  const WT = ["sonntag", "montag", "dienstag", "mittwoch", "donnerstag", "freitag", "samstag"];
  const WT_KURZ = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
  const TAG_RE = "(?:montag|dienstag|mittwoch|donnerstag|freitag)s?";
  const TAGE_RE = TAG_RE + "(?:\\s*(?:,|und|&|\\+|/)\\s*" + TAG_RE + ")*";

  // ---------- Text ----------
  function norm(s) {
    return String(s || "").toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
      .normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9.\- ]/g, " ").trim().replace(/\s+/g, " ");
  }
  // "Bassek, Yvone" und "Yvone Bassek" ergeben denselben Schlüssel
  function nameKey(s) { return norm(s).replace(/\./g, "").split(" ").filter(Boolean).sort().join(" "); }
  function nachname(s) { const t = String(s || ""); return norm(t.indexOf(",") !== -1 ? t.split(",")[0] : t.trim().split(/\s+/).pop()); }
  function vorname(s) { const t = String(s || ""); return norm(t.indexOf(",") !== -1 ? t.split(",").slice(1).join(" ") : t.trim().split(/\s+/).slice(0, -1).join(" ")).replace(/\./g, ""); }
  // Suche: jedes Wort muss im Namen vorkommen, Reihenfolge egal
  function passtSuche(name, suche) { const n = norm(name).replace(/,/g, " "); return norm(suche).split(" ").filter(Boolean).every((w) => n.includes(w)); }

  // "Ü 35.3 SF" / "ME6" / "ME1.0 (?)" -> "Ü35.3SF" / "ME6.0" / "ME1.0"; "prüfen" -> ""
  function normLinie(s) {
    const m = /^([A-ZÄÖÜ]+)(\d+)(\.\d+)?([A-Z]*)/.exec(String(s || "").toUpperCase().replace(/\s+/g, ""));
    return m ? m[1] + m[2] + (m[3] || ".0") + m[4] : "";
  }
  // Natürliche Reihenfolge: Z2.0 vor Z12.0, Ü wie U
  function linienSort(a, b) { return a.replace(/^Ü/, "U").localeCompare(b.replace(/^Ü/, "U"), "de", { numeric: true }); }

  // "Hin" / "Rück (Mittag)" / "Hin+Rück" / "Hin (Rück prüfen)" -> {hin, rueck}; ohne Angabe = beide
  function tourVon(s) {
    const t = String(s || "").replace(/\([^)]*\)/g, "").toLowerCase();
    const hin = /hin/.test(t), rueck = /rück|rueck|ruck/.test(t);
    return hin || rueck ? { hin: hin, rueck: rueck } : { hin: true, rueck: true };
  }

  // ---------- Datum ----------
  function pad(n) { return String(n).padStart(2, "0"); }
  function isoAusDe(s) {
    const t = String(s || "");
    let m = /(\d{1,2})\.(\d{1,2})\.(\d{4})/.exec(t);
    if (m) return m[3] + "-" + pad(m[2]) + "-" + pad(m[1]);
    m = /(\d{4})-(\d{2})-(\d{2})/.exec(t);
    return m ? m[0] : "";
  }
  function alsDatum(iso) { const t = iso.split("-"); return new Date(+t[0], +t[1] - 1, +t[2], 12); }
  function isoVon(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }

      return '<div class="zeile' + (gewaehlt === l.code ? " an" : "") + (z.beendet ? " beendet" : "") + '" data-l="' + esc(l.code) + '">' +
        '<div class="lb" style="--c:' + gruppenFarbe(l.gruppe) + '">' + esc(l.code) + "</div>" +
        '<div><div class="name">' + esc(zeiten || "keine Fahrgäste") + '</div><div class="meta">' +
        '<span class="pill">' + z.hin + " Hin</span>" + '<span class="pill">' + z.rueck + " Rück</span>" +
        (z.abwesend ? '<span class="pill k">' + z.abwesend + " abwesend</span>" : "") +
        (z.neu ? '<span class="pill u">' + z.neu + " neu</span>" : "") +
        (l.extra.length ? '<span class="pill g">+' + l.extra.length + " heute</span>" : "") +
        (pruefenOffen(l.code) ? '<span class="pill w">prüfen</span>' : "") + (z.beendet ? '<span class="pill">beendet</span>' : "") +
        '</div></div><div class="std">' + z.fahrgaeste + "<small>Fahrgäste</small></div></div>";
    }

    function links() {
      if (suche) return trefferListe();
      if (ansicht === "linien") {
        const gruppen = new Map();
        erg.linien.forEach((l) => { if (!gruppen.has(l.gruppe)) gruppen.set(l.gruppe, []); gruppen.get(l.gruppe).push(l); });
        // Überschriften und Linien alphabetisch (Linien natürlich: Z2.0 vor Z12.0)
        const reihen = [...gruppen.values()].sort((a, b) => werkstatt(a[0]).localeCompare(werkstatt(b[0]), "de"));
        $("links").innerHTML = reihen.map((ls) => {
          return '<h2 class="gruppe"><span class="punkt" style="background:' + gruppenFarbe() + '"></span>' + esc(werkstatt(ls[0])) + " <small>" + ls.length + (ls.length === 1 ? " Linie" : " Linien") + "</small></h2>" + ls.map(linienZeile).join("");
        }).join("") || '<div class="leer">Keine Linien in der Liste.</div>';
      } else {
        const tp = ansicht === "tagesplan";
        const liste = tp ? hw.tagesplan : hw.pruefen;
        const offen = liste.filter((h) => !h.erledigt), fertig = liste.filter((h) => h.erledigt);
        $("links").innerHTML = (tp ? "<h2>Tagesplan · " + esc(tagLang(tag)) + " <small>" + offen.length + " offen</small></h2>" : "<h2>Hinweise <small>" + offen.length + " zu prüfen</small></h2>") +
          (offen.length ? offen.map(hinweisZeile).join("") : '<div class="leer">' + (tp ? "Für diesen Tag ist nichts offen. 👍" : "Keine offenen Hinweise. 👍") + "</div>") +
          (fertig.length ? '<details class="weg-liste"><summary class="abschnitt">Erledigt <small>' + fertig.length + "</small></summary>" + fertig.map(hinweisZeile).join("") + "</details>" : "");
        document.querySelectorAll("#links [data-erl]").forEach((b) => b.addEventListener("click", (ev) => {
          ev.stopPropagation();
          const h = liste.find((x) => x.id === b.dataset.erl); if (h) erledigen(h, !h.erledigt);
        }));
      }
      bindeKlicks();
    }

    function hinweisZeile(h) {
      let icon, text, unter = "", quelle = "";
      if (h.quelle === "plan") {
        const t = h.t, a = ART[t.artKey] || ART.sonst;
        icon = a; const ziel = t.artKey === "wechsel" || t.artKey === "zusatz" || t.artKey === "einplanung" ? (t.neueLinie ? " → " + t.neueLinie : "") : "";
        text = "<b>" + esc(t.name) + "</b> · " + esc(t.tour || "") + " · " + esc(t.alteLinie || "") + esc(ziel);
        unter = esc(a[2] || t.art) + (t.offen ? " seit " + Linien.kurz(t.iso) + " (unbefristet)" : ansicht === "hinweise" ? " am " + tagKurz(t.iso) : "") + (t.abholzeit ? " · Abholung " + esc(t.abholzeit) : "") + (t.grund ? " – " + esc(t.grund) : "");
        quelle = esc(t.quelle || "") + (t.eingang ? " · Eingang " + esc(t.eingang) : "") + (h.erledigt ? " · " + esc(t.erledigt) : "");
        if (ansicht === "hinweise") icon = ["!", "#ca8a04"];
      } else {
        icon = ["!", "#ca8a04"];
        text = "<b>" + esc(h.name) + "</b>" + (h.touren ? " · " + esc(h.touren.join(", ")) : "");
        unter = esc(h.text);
        quelle = "aus der Fahrgastliste";
      }
      const p = Linien.nameKey(h.name);
      const ziel = h.linie && erg.linien.some((l) => l.code === h.linie) ? ' data-l="' + esc(h.linie) + '"' + (h.quelle === "plan" || h.touren ? ' data-p="' + esc(p) + '"' : "") : "";
      return '<div class="hinweis' + (h.erledigt ? " ist-erledigt" : "") + '"' + ziel + '><span class="i" style="background:' + icon[1] + '">' + icon[0] + "</span><div>" + text +
        '<span class="klein">' + unter + "</span>" + (quelle ? '<span class="quelle">' + quelle + "</span>" : "") + "</div>" +
        '<button type="button" class="erl' + (h.erledigt ? " zurueck" : "") + '" data-erl="' + esc(h.id) + '">' + (h.erledigt ? "Zurückholen" : "✓ Erledigt") + "</button></div>";
    }

    // Suche: Fahrgäste (alle Linien, auch ausgetragene) und Linien
    function trefferListe() {
      const personen = [...erg.personen.values()].filter((p) => Linien.passtSuche(p.name, suche)).sort((a, b) => a.name.localeCompare(b.name, "de"));
      const nl = Linien.normLinie(suche), roh = suche.toUpperCase().replace(/\s+/g, "");
      const linien = erg.linien.filter((l) => l.code === nl || (roh.length >= 2 && /\d/.test(roh) && l.code.replace(/\s+/g, "").startsWith(roh)));
      $("links").innerHTML = (personen.length ? "<h2>Fahrgäste <small>" + personen.length + " Treffer</small></h2>" + personen.slice(0, 60).map((p) => {
        const rows = p.rows.slice().sort((a, b) => (a.status.art === "weg") - (b.status.art === "weg") || (a.tour === "hin" ? -1 : 1));
        const pills = rows.map((r) => {
          const weg = r.status.art === "weg", l = erg.linien.find((x) => x.code === r.linie);
          return '<button type="button" class="pill lp" style="--c:' + (weg ? "#94a3b8" : gruppenFarbe(l && l.gruppe)) + '" data-l="' + esc(r.linie) + '" data-p="' + esc(p.key) + '">' + (r.tour === "hin" ? "Hin " : "Rück ") + esc(r.linie) + " · " + esc(r.zeit) + (weg ? " · ausgetragen" : "") + "</button>";
        }).join("");
        const abw = rows.find((r) => r.abwesend || r.status.art === "pause");
        const erste = rows.find((r) => r.status.art !== "weg") || rows[0];
        return '<div class="zeile person" data-l="' + esc(erste.linie) + '" data-p="' + esc(p.key) + '"><div class="ava" style="background:' + (rows.every((r) => r.status.art === "weg") ? "#94a3b8" : farbe(p.name)) + '">' + esc(initialen(p.name)) + "</div>" +
          '<div><div class="name">' + esc(p.name) + '</div><div class="meta">' + pills + (abw ? '<span class="pill k">abwesend</span>' : "") + '</div></div><div class="std" style="color:var(--leise)">›</div></div>';
      }).join("") : "") +
      (linien.length ? "<h2" + (personen.length ? ' style="border-top:1px solid var(--linie)"' : "") + ">Linien <small>" + linien.length + "</small></h2>" + linien.map(linienZeile).join("") : "") +
      (!personen.length && !linien.length ? '<div class="leer">Kein Fahrgast und keine Linie gefunden.</div>' : "");
      bindeKlicks();
    }

    function bindeKlicks() {
      document.querySelectorAll("#links [data-l]").forEach((z) => z.addEventListener("click", (ev) => {
        ev.stopPropagation();
        oeffne(z.dataset.l, z.dataset.p || null);
      }));
    }
    function oeffne(code, personKey) {
      gewaehlt = code; markiert = personKey;
      links(); rechts();
      const ziel = markiert && document.querySelector("#rechts .fg.treffer");
      if (ziel) ziel.scrollIntoView({ block: "center", behavior: "smooth" });
      else if (innerWidth < 820) $("rechts").scrollIntoView({ behavior: "smooth" });
    }

    let aktionen = [];
    function knopf(text, typ, x, cls) { return '<button type="button" class="tag-aktion' + (cls ? " " + cls : "") + '" data-a="' + aktionen.push({ typ: typ, x: x }) + '">' + text + "</button>"; }

    function fgZeile(r) {
      const s = r.status, pills = [], notizen = [];
      let cls = "", k = "";
      if (r.status.art === "weg") { cls = " weg"; pills.push('<span class="pill">ausgetragen' + (s.seit ? " seit " + Linien.kurz(s.seit) : "") + "</span>"); }
      else if (s.art === "kuenftig") pills.push('<span class="pill u">neu ab ' + Linien.kurz(s.ab) + "</span>");
      else if (s.art === "pause") { cls = " pause"; pills.push('<span class="pill u">pausiert ' + esc(s.von ? Linien.zeitraum(s.von, s.pauseBis) : "bis " + Linien.kurz(s.pauseBis)) + "</span>"); }
      else if (r.abwesend) {
        const a = r.abwesend; cls = " abw";
        pills.push('<span class="pill k">abwesend ' + esc(a.offen ? "seit " + Linien.kurz(a.von) + " (unbefristet)" : Linien.zeitraum(a.von, a.bis)) + "</span>");
        notizen.push('<span class="notiz rot">' + esc(a.grund || "laut NE.W-Mail") + "</span>");
      } else if (r.wechselNach) { cls = " wechsel"; pills.push('<span class="pill o">fährt heute mit ' + esc(r.wechselNach) + "</span>"); }
      else if (r.keinFahrtag) { cls = " nicht"; pills.push('<span class="pill">heute kein Fahrtag · ' + esc(r.keinFahrtag) + "</span>"); }
      if (r.demnaechst) pills.push('<span class="pill rand">abwesend ' + esc(Linien.zeitraum(r.demnaechst.von, r.demnaechst.bis)) + "</span>");
      if (s.pauseVon) pills.push('<span class="pill rand">pausiert ' + esc(Linien.zeitraum(s.pauseVon, s.pauseBis)) + "</span>");
      if (s.neu) pills.push('<span class="pill u">neu seit ' + Linien.kurz(s.neu) + "</span>");
      if (s.endet && s.art !== "weg") pills.push('<span class="pill w">fährt bis ' + Linien.kurz(s.endet) + "</span>");
      if (r.rollstuhl) pills.push('<span class="pill l">♿ Rollstuhl</span>');
      if (r.begleitung) pills.push('<span class="pill g">Begleitperson</span>');
      if (s.pruefen && pruefenOffen(r.linie, r.key)) pills.push('<span class="pill w" title="' + esc(s.text) + '">prüfen</span>');
      if ((s.pruefen || s.art === "weg" || s.endet || s.art === "kuenftig") && s.art !== "pause" && s.text && s.text !== "aktiv") notizen.push('<span class="notiz">Status: ' + esc(s.text) + "</span>");
      if (r.besonderheiten) notizen.unshift('<span class="notiz">' + esc(r.besonderheiten) + "</span>");
      // Knöpfe: Anruf "fährt nicht mit", austragen, wieder aufnehmen
      if (s.art === "weg") k = knopf("Wieder aufnehmen", "aufnehmen", r);
      else {
        const a = r.abwesend || r.demnaechst;
        if (a && (a.offen || a.bis >= daten.heute)) k += knopf("Abwesenheit aufheben", "aufheben", r);
        if (s.art !== "kuenftig" && !r.abwesend) k += knopf("Fährt nicht mit", "abwesend", r);
        k += knopf("Austragen", "austragen", r, "rot");
      }
      return '<div class="fg' + cls + (markiert && r.key === markiert ? " treffer" : "") + '"><div class="uhr"><b>' + esc(r.zeit || "–") + "</b><small>" + (r.ankunft ? "an " + esc(r.ankunft) : "") + "</small></div>" +
        '<div class="wer"><div class="name">' + esc(r.name) + " " + pills.join("") + '</div><div class="adr">' + esc(r.adresse || "") + "</div>" + notizen.join("") + '</div><div class="fg-knoepfe">' + k + "</div></div>";
    }
    function extraZeile(x) {
      return '<div class="fg extra' + (markiert && Linien.nameKey(x.name) === markiert ? " treffer" : "") + '"><div class="uhr"><b>' + esc(x.zeit || "–") + "</b><small>" + esc(x.tour) + "</small></div>" +
        '<div class="wer"><div class="name">' + esc(x.name) + ' <span class="pill ' + (x.art === "zusatz" ? "g" : "o") + '">' + (x.art === "zusatz" ? "Zusatzfahrt" : "Linienwechsel" + (x.von ? " von " + esc(x.von) : "")) + "</span></div>" +
        (x.grund ? '<span class="notiz">' + esc(x.grund) + "</span>" : "") + "</div><div></div></div>";
    }

    // Rechts: Kopf der Linie, darunter Hinfahrt und Rückfahrt als eigene Felder
    function rechts() {
      aktionen = [];
      const l = gewaehlt && erg.linien.find((x) => x.code === gewaehlt);
      if (!l) { $("rechts").innerHTML = '<div class="karte"><div class="leer">Linie anklicken oder oben einen Fahrgast suchen.</div></div>'; return; }
      const z = l.zahlen;
      const feld = (cls, pfeil, titel, info, inhalt) => '<div class="karte feld ' + cls + '"><div class="fahrt-kopf">' + (pfeil ? '<span class="pfeil">' + pfeil + "</span>" : "") + titel + (info !== "" ? "<small>" + info + "</small>" : "") + "</div>" + inhalt + "</div>";
      const fahrt = (rows, cls, pfeil, titel) => feld(cls, pfeil, titel, rows.length ? rows.filter((r) => r.faehrt).length + " von " + rows.length + " fahren " + esc(tagKurz(tag)) : "",
        rows.length ? rows.map(fgZeile).join("") : '<div class="leer klein">Keine ' + titel + " auf dieser Linie.</div>");
      $("rechts").innerHTML =
        '<div class="karte"><div class="detail-kopf"><div class="lb xl" style="--c:' + gruppenFarbe() + '">' + esc(l.code) + "</div><div><strong>Linie " + esc(l.code) + '</strong><span class="unter">Ziel: ' + esc(werkstatt(l) || "–") + "</span>" +
        (l.hinweis ? '<div class="meta"><span class="pill w">⚠ ' + esc(l.hinweis) + "</span></div>" : "") +
        '</div><div class="gross">' + z.fahrgaeste + "<small>Fahrgäste " + esc(tagKurz(tag)) + '</small></div><button type="button" class="knopf-neu" data-a="' + aktionen.push({ typ: "neu", x: l }) + '">+ Fahrgast</button></div></div>' +
        (l.extra.length ? feld("extra", "+", "Heute zusätzlich", "laut Tagesplan", l.extra.map(extraZeile).join("")) : "") +
        fahrt(l.hin, "hin", "→", "Hinfahrt") + fahrt(l.rueck, "rueck", "←", "Rückfahrt") +
        (l.kuenftig.length ? feld("", "", "Kommt neu dazu", l.kuenftig.length, l.kuenftig.map(fgZeile).join("")) : "") +
        (l.weg.length ? '<details class="karte feld weg-liste"' + (markiert && l.weg.some((r) => r.key === markiert) ? " open" : "") + '><summary class="fahrt-kopf">Ausgetragen <small>' + l.weg.length + "</small></summary>" + l.weg.map(fgZeile).join("") + "</details>" : "");
      document.querySelectorAll("#rechts [data-a]").forEach((b) => b.addEventListener("click", () => {
        const a = aktionen[+b.dataset.a - 1];
        ({ neu: neuFormular, abwesend: abwesendFormular, aufheben: aufhebenFormular, austragen: austragenFormular, aufnehmen: aufnehmen })[a.typ](b, a.x);
      }));
    }

    // ---------- Fahrgäste ändern (schreibt ins Google Sheet) ----------
    const WER = ["Anruf Fahrgast / Angehörige", "Anruf Werkstatt / NE.W", "Anruf Wohnheim / Betreuer", "Sonstiges"];
    const pin = () => speicherS("az_dispo_pin");
    const ersterTag = () => (tag >= daten.heute ? tag : Linien.startTag(daten.heute));
    function werktage(von, bis) { const out = []; for (let d = von; d <= bis && out.length < 400; d = Linien.plusTage(d, 1)) if (Linien.werktag(d)) out.push(d); return out; }
    function formularOeffnen(knopf, html, rot) {
      document.querySelectorAll("#rechts .korr").forEach((f) => f.remove());
      const f = document.createElement("div");
      f.className = "korr" + (rot ? " rot" : ""); f.innerHTML = html;
      (knopf.closest(".fg") || knopf.closest(".detail-kopf")).after(f);
      f.querySelector(".neben").addEventListener("click", () => f.remove());
      f.scrollIntoView({ block: "nearest", behavior: "smooth" });
      return f;
    }
    const tourWahl = '<label>Fahrten<select class="k-tour"><option value="beide">Hin + Rück</option><option value="hin">nur Hinfahrt</option><option value="rueck">nur Rückfahrt</option></select></label>';
    const werWahl = '<label>Wer hat Bescheid gegeben?<select class="k-wer">' + WER.map((w) => "<option>" + esc(w) + "</option>").join("") + "</select></label>";
    async function aktionSenden(body, okText) {
      $("laden").hidden = false;
      let r;
      try { r = await apiPost(Object.assign({ aktion: "fahrgast", pin: pin() }, body)); } catch (e) { r = { status: "error", message: "Keine Verbindung – nichts geändert." }; }
      $("laden").hidden = true;
      if (r.status === "ok") { toast(okText(r)); await lade(pin()); }
      else if (r.status === "pin" || r.status === "gesperrt") { toast(r.message, true); $("abmelden").click(); }
      else toast(r.message || "Fehler.", true);
    }

    // Anruf: fährt für einen Zeitraum nicht mit -> Tagesplan + Ausfälle
    function abwesendFormular(knopf, r) {
      const von0 = ersterTag();
      const f = formularOeffnen(knopf, '<div class="korr-kopf"><b>' + esc(r.name) + "</b> fährt nicht mit · Linie " + esc(r.linie) + "</div>" +
        '<div class="korr-zeile"><label>Von<input type="date" class="k-von" value="' + von0 + '" /></label><label>Bis<input type="date" class="k-bis" value="' + von0 + '" /></label>' +
        '<div class="chips"><button type="button" data-d="0">1 Tag</button><button type="button" data-d="6">1 Woche</button><button type="button" data-d="13">2 Wochen</button></div></div>' +
        '<div class="korr-zeile">' + tourWahl + werWahl + '<label>Grund <span class="opt">(optional)</span><input type="text" class="k-g" placeholder="z. B. krank, Urlaub, Kur" /></label></div>' +
        '<div class="korr-vorschau"></div><div class="korr-knoepfe"><button type="button" class="speichern">Eintragen</button><button type="button" class="neben">Abbrechen</button></div>');
      const von = f.querySelector(".k-von"), bis = f.querySelector(".k-bis"), sp = f.querySelector(".speichern"), vs = f.querySelector(".korr-vorschau");
      function vorschau() {
        const t = von.value && bis.value && bis.value >= von.value ? werktage(von.value, bis.value) : [];
        if (!von.value || !bis.value || bis.value < von.value) { vs.innerHTML = '<span class="fehl">„Bis“ darf nicht vor „von“ liegen.</span>'; sp.disabled = true; return; }
        if (!t.length) { vs.innerHTML = '<span class="fehl">Im Zeitraum liegt kein Werktag.</span>'; sp.disabled = true; return; }
        const zeit = (r.tour === "hin" ? r.zeit : (erg.personen.get(r.key).rows.find((x) => x.linie === r.linie && x.tour === "hin") || r).zeit) || "08:00";
        const std = (new Date(t[0] + "T" + zeit) - new Date()) / 36e5;
        vs.innerHTML = t.length + (t.length === 1 ? " Fahrtag: " + tagKurz(t[0]) : " Fahrtage: " + tagKurz(t[0]) + " – " + tagKurz(t[t.length - 1])) +
          (std < 24 ? '<br><span class="warn">Kurzfristig (unter 24 Std. vor der Abholung) – steht in „Ausfälle“ mit „prüfen“.</span>' : "");
        sp.disabled = false;
      }
      f.querySelectorAll(".chips button").forEach((c) => c.addEventListener("click", () => {
        let b = Linien.plusTage(von.value || von0, +c.dataset.d); while (!Linien.werktag(b)) b = Linien.plusTage(b, -1);
        bis.value = b < von.value ? von.value : b; vorschau();
      }));
      von.addEventListener("input", () => { if (bis.value < von.value) bis.value = von.value; vorschau(); });
      bis.addEventListener("input", vorschau); vorschau();
      sp.addEventListener("click", () => aktionSenden({ op: "abwesend", linie: r.linie, name: r.name, von: von.value, bis: bis.value, touren: f.querySelector(".k-tour").value,
        wer: f.querySelector(".k-wer").value, grund: f.querySelector(".k-g").value.trim() }, (x) => r.name + ": " + x.tage + (x.tage === 1 ? " Fahrtag" : " Fahrtage") + " eingetragen"));
    }

    function aufhebenFormular(knopf, r) {
      const a = r.abwesend || r.demnaechst, ab0 = a.von > ersterTag() ? a.von : ersterTag();
      const f = formularOeffnen(knopf, '<div class="korr-kopf"><b>' + esc(r.name) + "</b> – Abwesenheit " + esc(a.offen ? "seit " + Linien.kurz(a.von) + " (unbefristet)" : Linien.zeitraum(a.von, a.bis)) + " aufheben</div>" +
        '<div class="korr-zeile"><label>Fährt wieder mit ab<input type="date" class="k-ab" value="' + ab0 + '" min="' + daten.heute + '" /></label></div>' +
        '<div class="korr-vorschau">Vergangene Tage bleiben im Tagesplan und in „Ausfälle“ (Abrechnung).</div>' +
        '<div class="korr-knoepfe"><button type="button" class="speichern">Aufheben</button><button type="button" class="neben">Abbrechen</button></div>');
      f.querySelector(".speichern").addEventListener("click", () => aktionSenden({ op: "aufheben", linie: r.linie, name: r.name, von: f.querySelector(".k-ab").value, bis: a.offen ? "" : a.bis },
        () => r.name + ": Abwesenheit aufgehoben"));
    }

    function austragenFormular(knopf, r) {
      const f = formularOeffnen(knopf, '<div class="korr-kopf"><b>' + esc(r.name) + "</b> von Linie " + esc(r.linie) + " austragen</div>" +
        '<div class="korr-zeile"><label>Fährt nicht mehr ab<input type="date" class="k-ab" value="' + ersterTag() + '" /></label>' + tourWahl + werWahl + "</div>" +
        '<div class="korr-zeile"><label class="breit">Grund <span class="opt">(optional)</span><input type="text" class="k-g" placeholder="z. B. Werkstatt gewechselt, Umzug" /></label></div>' +
        '<div class="korr-vorschau">Bleibt unter „Ausgetragen“ sichtbar und kann wieder aufgenommen werden.</div>' +
